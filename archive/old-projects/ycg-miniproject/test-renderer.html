<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>元素渲染检测工具</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
        h1 { color: #333; }
        .test-result { margin: 15px 0; padding: 15px; border-radius: 8px; border-left: 4px solid; }
        .success { background: #d4edda; border-color: #28a745; color: #155724; }
        .info { background: #d1ecf1; border-color: #17a2b8; color: #0c5460; }
        .error { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow: auto; }
    </style>
</head>
<body>
    <h1>🔍 元素渲染检测工具</h1>
    <p>这个页面用于检查 uni-app 项目的内容是否正常渲染</p>

    <div id="results"></div>

    <button onclick="runTests()">运行检测</button>

    <script>
        function logResult(type, title, details) {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${title}</strong><div style="margin-top:8px; font-size:14px; opacity:0.9;">${details}</div>`;
            document.getElementById('results').appendChild(div);
        }

        async function runTests() {
            console.log('=== 开始运行检测 ===');
            document.getElementById('results').innerHTML = '';
            
            logResult('info', '1/4', '初始化检测...');
            
            // 测试 1：检查当前页面是否正常
            const currentTitle = document.title;
            logResult('success', '标题检查', `页面标题: ${currentTitle}`);
            
            // 测试 2：统计页面内容
            const totalElements = document.querySelectorAll('*').length;
            logResult('success', '元素统计', `页面共有 ${totalElements} 个 DOM 元素`);
            
            // 测试 3：检查是否有内容
            const bodyText = document.body.innerText || document.body.textContent;
            const hasContent = bodyText.trim().length > 0;
            logResult(hasContent ? 'success' : 'error', '内容检查', 
                `页面内容长度: ${bodyText.length} 字符`);
            
            // 测试 4：如果是开发服务器页，提示
            if (window.location.hostname.includes('localhost')) {
                logResult('info', '环境信息', 
                    `这是本地开发服务器，请检查: http://localhost:5177/`);
            }
            
            // 展示所有页面文本（开头部分）
            logResult('info', '页面内容预览', 
                `<pre style="margin-top:8px;">${bodyText.substring(0, 500)}</pre>`);
            
            console.log('=== 检测完成 ===');
        }

        // 页面加载时自动运行
        window.onload = () => {
            setTimeout(runTests, 500);
        };
    </script>
</body>
</html>
