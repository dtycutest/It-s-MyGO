<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一次买够</title>
    <style>
      .debug-panel {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #007bff;
        color: white;
        padding: 15px;
        z-index: 99999;
        font-family: sans-serif;
        text-align: center;
      }
      .debug-content {
        background: white;
        color: #333;
        margin: 70px 20px 20px;
        padding: 20px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <!-- 这部分是直接写入的，肯定会显示 -->
    <div class="debug-panel">
      ✅ 这个直接显示 - 如果看到我，说明 HTML 正常
    </div>
    
    <div class="debug-content">
      <h3>⚡ 直接 HTML 内容</h3>
      <p>如果你能看到这个，说明浏览器在正常工作！</p>
      <p>这是不依赖任何 JS 的内容。</p>
      
      <p><strong>接下来检查:</strong></p>
      <ul>
        <li>打开 F12 看 Console 是否有错误</li>
        <li>看下方的 #app 是否有内容</li>
      </ul>
    </div>
    
    <!-- Vue 应用容器 -->
    <div id="app"></div>
    
    <script>
      // 简单的脚本，肯定会执行
      console.log('[index.html] 脚本开始执行');
      console.log('[index.html] 当前时间:', new Date().toLocaleString());
      
      window.addEventListener('load', function() {
        console.log('[index.html] window.load 事件');
        console.log('[index.html] #app 元素存在吗?', !!document.getElementById('app'));
      });
      
      document.addEventListener('DOMContentLoaded', function() {
        console.log('[index.html] DOMContentLoaded 事件');
      });
    </script>
  </body>
</html>
